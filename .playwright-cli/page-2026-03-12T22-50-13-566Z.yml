            - generic [ref=f1e236]:
              - heading "STOP! A Note Before You Start:" [level=4] [ref=f1e237]
              - paragraph [ref=f1e238]: All combat situations in this encounter are avoidable, whether by stealth, negotiation, deception, bribery, cleverness, or good old-fashioned running away. If a combat is initiated that the players no longer wish to participate in, any combat situation can be de-escalated with a DC 13 Charisma or Wisdom check, along with a plan or alternative solution from a player character. With the exception of running away, “defeating” a foe in any of these manners will still count for XP gained. Pacifistic approaches are completely valid here, and it may be a good idea to remind your players of this at the beginning of the session. You may also choose, by your own discretion, to have combatant monsters and NPCs attempt to de-escalate the situation.
            - paragraph:
              - img [ref=f1e239]
