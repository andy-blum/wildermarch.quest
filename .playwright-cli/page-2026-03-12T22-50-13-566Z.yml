          - generic [ref=f1e245]:
            - heading "Outside the Bakery" [level=1] [ref=f1e246]
            - heading "1- Entrance" [level=2] [ref=f1e247]
            - paragraph [ref=f1e250]: As you approach the large stone building, the road turns into a gravel path surrounded by an overgrown lawn, leading toward a large set of wooden double doors. The fragrance of ripening apples is thick in the air from the old apple orchard in the back. There is one massive apple tree near the path to the front doors. As the wind whistles through the long grasses, you notice that the bark of the tree looks almost like an ancient, wizened face.”
            - paragraph [ref=f1e251]: The tree is an apple treant named Mac, or Macintosh. He is grumpy and old, and has very little patience for the antics of youngsters. He knows of the goblins inside the building, but does not particularly care, since they killed the zombies that overran the village, and mostly ignore him. If any of the players poses a threat to any of the other trees or plants in the area, Mac is now hostile towards them. He aims only to incapacitate and never to kill, but he will not tolerate any harm to nature in his presence. He can, at will, awaken the nine shrubs in the front of the building to go and pester the party. With DC 12 Investigate or Charisma checks, he reveals that he doesn’t know about any secret recipes, but he remembers that old Grammy used to chat every day with the dryads who live out back in the old orchard, and suggests that they might know something.
            - paragraph [ref=f1e252]: The set of doors is loosely barred from the inside, as the goblins primarily use the back entrance. The wood is rotting and it can be broken open with a DC 14 Strength check.
            - heading "Outside" [level=2] [ref=f1e253]
            - paragraph [ref=f1e254]: For every ten minutes the group spends walking around outside the bakery, roll a d6 to find out if they encounter a patrol group of 1d4 goblins. On a 6, the goblins see them first and try to run away. On a 1, the group sees the goblins before they are spotted, and they can decide what to do from there. There are scattered corpses of zombies in the area.
            - heading "2- Apple Orchard" [level=2] [ref=f1e255]
            - paragraph [ref=f1e258]: The scent of apples is even thicker here. The older trees are arranged in neat orderly rows, but the saplings that have sprouted since the goblins took over are everywhere. There is a whispering sound that doesn’t seem to come from just the leaves rustling in the wind. Early ripened apples litter the ground. As you approach, one of them flies through the air, narrowly missing your heads. The sound of whispering is joined by the sound of giggling.
            - paragraph [ref=f1e264]:
              - text: The three dryads who live in the orchard are mischievous, but reclusive. They won’t come out to talk without an offering of a gift, or a DC 13 Persuasion check. They don’t like to give much information, but they also really don’t like those disgusting goblins, but they are better than the undead. It takes a DC 17 Persuasion or Investigation check for them to reveal that half the secret recipe is in the
              - emphasis [ref=f1e265]: front office
              - text: and half is in
              - emphasis [ref=f1e266]: Grammy’s apartment
              - text: . If they like the party, they can also reveal that they have a better chance of surprising the goblins if they go in through the loading dock. If the party in some way offends the dryads, they pelt them with half rotten apples until they leave, or until the dryads get bored.
            - heading "3- Waste Pile" [level=2] [ref=f1e267]
            - paragraph [ref=f1e270]: What was once an orderly row of compost and waste bins has long since been heaped up into a massive trash pile. It is overgrown with fungus and other decomposers taking advantage of the ready supply of food. It smells rancid, the odor being carried on the breeze.
            - paragraph [ref=f1e271]: If anyone comes within 5 feet of the waste pile, a violet fungus slowly oozes out (moving at half speed) and must be either fought or avoided.
