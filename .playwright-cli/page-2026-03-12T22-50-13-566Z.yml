            - heading "9- Grammy’s Apartment" [level=2] [ref=f1e335]
            - paragraph [ref=f1e338]: This once homey apartment where the famed Grammy used to reside has been turned into a true goblin hovel. Two goblins and their leader stand in the middle of the room, staring at you. Ancient mahogany furniture still stands in the room, too heavy for the goblins to move. A bed, missing a mattress stands in one corner. A wardrobe, now filled with crude weapons, is in the opposite corner. Against one wall is a desk, covered in animal pelts and hunting trophies.
            - paragraph [ref=f1e339]:
              - text: "These goblins (two regular goblins and one chief) can be negotiated with or fought. One of the desk drawers is trapped, but can be spotted with a DC 13 Perception check. A DC 16 Dexterity check will disarm the trap. If the drawer is opened without disarming it, a poison needle springs out of the drawer to stab whoever is opening it. It does 1 piercing damage and 1d10 poison damage. The victim will also need to make a DC 15 Constitution saving throw to avoid being poisoned for one hour. This drawer contains one half of the secret recipe on a torn up old parchment scroll. It also contains a small spellbook - more like a spell notebook - containing the few spells that old Grammy knew:"
              - emphasis [ref=f1e340]: Druidcraft, Entangle, Purify Food and Drink, and Speak with Plants
              - text: .
            - heading "Finale" [level=2] [ref=f1e341]
            - paragraph [ref=f1e342]: "Read the following aloud if the party brings the complete recipe back to Tyndareus:"
            - paragraph [ref=f1e344]: The old gnome’s face lights up as he reads through the recipe. ‘Of course, of course! It all makes sense,’ he says. He uses Mending to repair the torn parchment and gives it to his imp servant to make one immediately. He rummages in a drawer for a moment, then emerges with a rust-colored leather bag. ‘I think you’ll find that quite entertaining,’ he says, with a twinkle in his eye. He also gives you 1000 gold pieces, in a “bag of holding”. As the imp returns impossibly fast with a wonderful smelling pie, Tyndareus offers to share with you. It is, indeed, the tastiest apple pie you’ve ever had the pleasure to eat.
            - paragraph [ref=f1e345]: The rust-colored bag is a Bag of Tricks, which is of course, fun. If they do not retrieve the whole recipe, Tyndareus informs them that this is only half the recipe, and they’ll have to go back for the rest. If they tell him that it is impossible, or if they quit, he is disappointed, but resigned to his pie-less fate.
