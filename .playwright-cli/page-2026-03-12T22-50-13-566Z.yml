          - generic [ref=f1e157]:
            - heading "Introduction" [level=1] [ref=f1e158]
            - paragraph [ref=f1e159]: "The players have been summoned, whether individually or as an assembled party, to a wizard’s tower in Trostenwald with the promise of a paying job. The wizard’s imp servant has led them into the tower and shown them up to the wizard’s study. Read the following aloud:"
            - generic [ref=f1e160]:
              - paragraph [ref=f1e161]: Although you were initially distrustful when the imp appeared at the door to let you into the old wizard’s tower, inside you have seen enough benign wonders to assuage your concerns. At the top of a long and winding staircase is the wizard’s study. Within, you see a room lined with bookshelves, and a desk covered with bubbling potions, mysterious trinkets, and ink-stained scraps of parchment. An elderly Gnome with long, wispy, white hair and beard, twinkling eyes, and a large hooked nose. He sits in a cozy chair behind the desk. He very slowly stands up and introduces himself as Tyndareus the Green. He pours you each a cup of tea and finally tells you why he summoned you here.
              - paragraph [ref=f1e162]: ‘When I was a boy,’ he says, smacking his lips, ‘I tasted the most wonderful treat in all the Material Plane. I remember it like it was yesterday. Grammy’s Country Apple Pies…’he trails off ‘The bakery was near my village and you could smell the spices all day and night, no matter where you were in town. Alas, when I went away to wizard college, the place was overrun by the undead and no one has dared go back in since. I’d like to taste those heavenly pies just once more before I depart for the Celestial Plane. If I give you a map to the bakery, can you go in and find Grammy’s secret recipe for me?’
            - paragraph [ref=f1e163]: If the players inquire as to what their reward will be, the wizard informs them that he will pay a large sum of gold at the end, and he tells them that they can keep anything of value they might find in the bakery. Also if they can find a peaceful way of getting the recipe he will provide a bonus award.
            - paragraph [ref=f1e164]: All he really wants is the recipe.
            - heading "To The Bakery" [level=2] [ref=f1e165]
            - paragraph [ref=f1e166]: The map reveals that it is about four days ride, or 2 days by boat, to the bakery. The players can stock up on any general goods they feel they might need in Trostenwald (anything from the Player’s Handbook equipment and gear tables are fair game). The trip can pass uneventfully, or the DM may choose to roll a d6, on a 5 or 6, roll a d6 on the following table for a random encounter.
