            - paragraph [ref=f1e660]: When the ancient wizard, Tyndareus of Trostenwald, develops a craving for a special treat from his childhood, he will stop at nothing to get his hands on the best apple pie in the whole world. He hires a group of adventurers to seek out the bakery that once produced the wonderful dessert.
            - paragraph [ref=f1e662]: Unfortunately for the adventurers, the bakery has long since been overrun by goblins. But all is not as it seems at Grammy’s Bakery, and Tyndareus isn’t the only one who’d do anything for those pies.
