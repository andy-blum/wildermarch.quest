          - generic [ref=f1e278]:
            - heading "Inside the Bakery" [level=1] [ref=f1e279]
            - heading "4- The Shop" [level=2] [ref=f1e280]
            - paragraph [ref=f1e283]: The shop is a small front area of the bakery where the famous pies could be sold directly to hungry customers. A counter at the back of the room stands surrounded by shelves on every wall. It appears that while the shelves once held lovely packages of pies, they have long since been ransacked; paper boxes and bits of ribbon and twine litter the floor. Two small tables have been overturned in the center of the room. There is a door on either side of the room, as well as the large double doors that lead outside.
            - paragraph [ref=f1e284]: There are many signs of goblin infestation in the room that could be used to track the goblins living here. If the party searches the counter area, a DC 12 Perception check will find a locked cashbox. It will require a DC 14 Sleight of Hand check to pick the lock, or DC 16 Strength to simply smash it open. It contains 8 gp, 11 sp, and 21 cp.
            - heading "5- Office" [level=2] [ref=f1e285]
            - paragraph [ref=f1e288]: This well-appointed room of sturdy mahogany furniture and velvet curtains contains two paper-strewn desks with overturned chairs. The remaining walls are lined with bookshelves and filing cabinets. The goblin odor is not as strong in here as it is in other areas of the bakery.
            - paragraph [ref=f1e289]: The goblins cannot read and see no use for stupid papers except as kindling for fires, and there’s plenty of that outside. The bookshelves contain records of the bakery’s finances (business was booming). A DC 13 Perception check will find the safe hidden behind one of the shelves. DC 15 Sleight of Hand check is required to pick the lock, or DC 17 Strength to pry it open. The safe contains 75 gp, 50 sp, and 25 cp.
            - paragraph [ref=f1e290]: One of the desk drawers is trapped, but the mechanism can be spotted with a DC 13 Perception check. A DC 16 Dexterity check will disarm the trap. If the drawer is opened without disarming it, a poison needle springs out of the drawer to stab whoever is opening it. It does 1 piercing damage and 1d10 poison damage. The victim will also need to make a DC 15 Constitution saving throw to avoid being poisoned for one hour. This drawer contains one half of the secret recipe on a torn up old parchment scroll.
            - paragraph [ref=f1e291]: Other drawers contain blank paper, quills, ink, etc. There is one silver signet ring worth about 10 gp. The curtains are still in decent condition and could probably fetch another 10 gp at the market, but they are heavy and cumbersome. The furniture would fetch a pretty penny indeed but is far too heavy to be moved without assistance.
            - heading "6- Guard Room" [level=2] [ref=f1e292]
            - paragraph [ref=f1e295]: Although there was little need for it, Grammy kept two or three young men from the nearby town employed as guards, more to keep them out of trouble than anything else. This room is where they kept their equipment and took breaks during long night patrols. Three quarterstaffs have fallen to the floor from where they once stood against one wall. There is a small table with two chairs, all of which have been overturned. A locked chest sits opposite the quarterstaffs.
            - paragraph [ref=f1e296]: The quarterstaffs are not in great condition, due to the wood not being preserved. If the party chooses to take and use them, roll a d6 when an attack made with one of them fails. On a 5 or 6, the staff breaks. The chest requires a DC 15 Dexterity check to pick the lock or a DC 17 Strength check to smash the lock off. Inside are three bottles of Shillelagh oil, which will work as if casting the spell Shillelagh when rubbed on a club or quarterstaff.
            - heading "7- Loading Dock" [level=2] [ref=f1e297]
            - paragraph [ref=f1e300]: A sliding wooden door opens into a room with bare stone floors and plain walls. An empty wagon stands abandoned in the room, gathering dust. You can see, within the bakery, packing and shipping pallets that stand ready to be loaded onto the wagon. As you watch, a patrol of two goblins walks by, oblivious.
            - paragraph [ref=f1e301]: If the party, on average, succeeds at a DC 13 Stealth check, the goblins continue on their patrol with no notice. If they do not, one of the goblins stops, sniffs the air, and declares that he smells something funny, and they come in to investigate.
            - heading "8- Bakery Floor" [level=2] [ref=f1e302]
            - paragraph [ref=f1e305]: The bakery floor is a wide open space with high ceilings with exposed wooden beams, sound echoing throughout the room. Two stone rooms stand to one side with heavy barred doors keeping them closed. Between them is a small glass cabinet with an even smaller mallet hanging on a chain. Six long work benches fill the center of the room, covered with pie tins, rolling pins, and other baking equipment. Some of the rolling pins are still rolling lazily back and forth, some enchantment keeping them in motion. Dulled knives chop at apples that haven’t been there in years. On the other side are six massive ovens, their doors still opening periodically, as if remembering that they are supposed to. Tall chimneys rise from each oven to pierce the ceiling overhead. The whole area is a mess, not the work of a professional baker. It looks as if someone has tried and failed to teach themselves to make pie.
            - paragraph [ref=f1e307]
            - paragraph [ref=f1e308]
          - generic [ref=f1e310]:
            - paragraph [ref=f1e311]: The glass cabinet contains two regular healing potions. The magic baking equipment might be able to fetch a few coppers as a curio for some interested wizard, but otherwise is in poor condition. The non-magical baking equipment wouldn’t even be able to get that, so much of it is eaten through with rust and rot. A “Mending” cantrip may be able to fix some of the physical damage, but it cannot restore or strengthen any magic.
            - paragraph [ref=f1e312]: The stone rooms, one used for ingredient storage and one for finished product storage, are mostly empty, but the runes inscribed in the stone are still keeping the rooms chilled. These runes can be copied by any magic users in the party. It is a second level spell, a variation on Cone of Cold which only lowers the temperature enough to cool food, not enough to do damage. A DC 15 Perception check will find several bags of exotic spices hidden away in a corner - a bag each of cinnamon, nutmeg, ginger, and cloves. Each one is worth about 5 gp.
            - paragraph [ref=f1e313]: The goblins have been attempting to replicate Grammy’s pies - which they have become addicted to. If the party attempts to interfere in any way with the magical objects, three goblins drop down from the rafters to stop them. They can be reasoned with and negotiated with, if the party agrees to show them the recipe. They cannot read, but they will remember things they are told verbally or that are demonstrated to them. DC 14 Charisma, Persuasion, or Intimidation, if that’s more your party’s style.
            - paragraph [ref=f1e314]: The goblins are not smart, and are easily deceived, but they will have a long memory of this deception. Or it comes to fighting, although the goblins do not wish to instigate combat.
            - paragraph [ref=f1e315]: "The ovens are still warm, but not hot, and certainly not hot enough to bake a pie (as evidenced by some half-baked messes in pie tins sitting on top of them). This is not due to magic, but by the residence of some creatures who find ovens very conveniently hospitable. They are comfortable and do not attack unless provoked. Roll a d4 on the following table:"
            - heading "Oven Encounter" [level=5] [ref=f1e316]
            - table [ref=f1e317]:
              - rowgroup [ref=f1e318]:
